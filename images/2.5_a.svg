<svg width="320" height="360" xmlns="http://www.w3.org/2000/svg">
  <!-- 坐标轴基线 -->
  <line x1="40" y1="310" x2="280" y2="310" stroke="#222" stroke-width="1.2"/>

  <!-- 容器 -->
  <path d="M 60 80 L 60 310 L 180 310 L 180 80" fill="none" stroke="#222" stroke-width="2"/>
  <!-- 液体 -->
  <path d="M 60 130 L 60 310 L 180 310 L 180 130" fill="#cce5ff" fill-opacity="0.6"/>
  <!-- 液面线 -->
  <line x1="60" y1="130" x2="180" y2="130" stroke="#222" stroke-width="1.4"/>

  <!-- A点：液面 -->
  <circle cx="120" cy="130" r="3" fill="#000"/>
  <text x="128" y="126" font-size="14">A</text>

  <!-- B点：侧壁小孔 -->
  <circle cx="180" cy="240" r="3" fill="#000"/>
  <text x="188" y="244" font-size="14">B</text>

  <!-- h_A 高度标注，手动实现下标 -->
  <line x1="50" y1="130" x2="50" y2="310" stroke="#444" stroke-dasharray="4 2"/>
  <line x1="46" y1="130" x2="54" y2="130" stroke="#444"/>
  <line x1="46" y1="310" x2="54" y2="310" stroke="#444"/>
  <text x="22" y="225" font-size="14">h</text>
  <text x="34" y="230" font-size="10">A</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  <!-- 出流速度 v_B 箭头，手动下标 -->
  <line x1="182" y1="240" x2="240" y2="240" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="210" y="232" font-size="14">v</text>
  <text x="222" y="237" font-size="10">B</text>

  <!-- 水流抛射虚线轨迹 -->
  <path d="M 182 240 Q 230 265 270 308" stroke="#222" stroke-width="1.2" fill="none" stroke-dasharray="5 3"/>

  <!-- 图号标签 (a) -->
  <text x="110" y="340" font-size="16">图2.5(a)</text>
</svg>
